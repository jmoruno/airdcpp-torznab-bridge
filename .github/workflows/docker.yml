name: Imagen Docker

# Ramas: publica :<rama> y :sha-<commit> para probar.
# Version estable X.Y.Z    -> :X.Y.Z :X.Y :stable :latest y release.
# Version beta X.Y.Z-rc.N  -> :X.Y.Z-rc.N :beta y pre-release.
# Se lanza en Actions > Imagen Docker > Run workflow (rama main) con "version" (p. ej. 2.1.0)
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar (p. ej. 2.1.0). Vacio = solo construir la rama"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/airdcpp-torznab-bridge
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar version
        if: env.VERSION != ''
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Version no valida: $VERSION"; exit 1; }
          [ "$GITHUB_REF_NAME" = main ] || { echo "::error::Las versiones solo se publican desde main"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then echo "::error::v$VERSION ya existe"; exit 1; fi

      - name: Poner la version en el codigo
        if: env.VERSION != ''
        run: sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" app/__init__.py

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' && !contains(env.VERSION, '-') }}
            type=raw,value=stable,enable=${{ env.VERSION != '' && !contains(env.VERSION, '-') }}
            type=raw,value=latest,enable=${{ env.VERSION != '' && !contains(env.VERSION, '-') }}
            type=raw,value=beta,enable=${{ contains(env.VERSION, '-') }}
            type=ref,event=branch,enable=${{ env.VERSION == '' }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Crear etiqueta y release
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$VERSION" == *-* ]]; then canal=beta; extra=--prerelease; else canal=stable; extra=--latest; fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes $extra \
            --notes "Imagen: \`docker pull $IMAGE:$VERSION\` (canal \`$canal\`)"
