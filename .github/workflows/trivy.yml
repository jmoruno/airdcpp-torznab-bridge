name: Trivy

# Escaneo de vulnerabilidades de la imagen Docker. Resultados en la pestana Security.
# Falla solo si hay vulnerabilidades CRITICAL con arreglo disponible.
on:
  push:
    branches: [main, dev]
    paths-ignore: ["**.md"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Construir la imagen
        run: docker build -t local/scan:${{ github.sha }} .
      - name: Informe (HIGH y CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/scan:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Comprobar (falla con CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/scan:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
